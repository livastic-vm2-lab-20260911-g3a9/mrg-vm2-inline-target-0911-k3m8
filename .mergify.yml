merge_queue:
  mode: serial
  max_parallel_checks: 1

queue_rules:
  - name: VM2 deprecated inplace two-step discriminator
    batch_size: 1
    allow_inplace_checks: true
    queue_conditions:
      - base = inplace-two-step-base
      - check-success = vm2-inplace-source
    merge_conditions:
      - check-success = vm2-inplace-queue-only
    merge_method: merge
    autoqueue: true

pull_request_rules: []
