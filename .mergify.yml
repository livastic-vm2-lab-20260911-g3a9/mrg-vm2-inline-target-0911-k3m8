merge_queue:
  mode: parallel
  max_parallel_checks: 3
scopes:
  source:
    manual:
  default_capacity: 2
queue_rules:
  - name: vm2-ci-key-default-sentinel-chain
    batch_size: 1
    merge_method: merge
    queue_conditions:
      - title ~= ^VM2_CIKEY_SENTINEL_
      - check-success = @github-actions/vm2-chain-slow-check
    merge_conditions:
      - title ~= ^VM2_CIKEY_SENTINEL_
      - check-success = @github-actions/vm2-chain-slow-check
      - check-success = vm2-never-pass-0915
