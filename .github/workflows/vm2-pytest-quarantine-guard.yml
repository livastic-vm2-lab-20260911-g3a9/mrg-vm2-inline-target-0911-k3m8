name: VM2 Pytest Quarantine Cleanup Guard
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pytest-guard:
    name: VM2 required pytest quarantine guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install released pytest-mergify
        run: python -m pip install 'pytest==8.4.2' 'pytest-mergify==2026.9.11.1'
      - name: Run protected pytest guard
        env:
          CI: 'true'
          MERGIFY_TOKEN: ${{ secrets.VM2_PYTEST_QUARANTINE_KEY }}
        run: pytest -q -s -rxX tests/test_vm2_quarantine_cleanup.py
