name: VM2 Current Datetime Slow
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  slow:
    name: vm2-current-datetime-slow
    runs-on: ubuntu-latest
    steps:
      - name: Delay speculative queue ref past deadline
        shell: bash
        run: |
          echo "head_ref=${GITHUB_HEAD_REF}"
          if [[ "$GITHUB_HEAD_REF" == mergify/merge-queue/* ]]; then
            echo VM2_CURRENT_DATETIME_SPECULATIVE_DELAY
            sleep 330
          else
            echo VM2_CURRENT_DATETIME_SOURCE_FAST
          fi
