name: VM2 Protected Release Prefix Secret Probe
on:
  push:
    branches:
      - 'release/**'
permissions:
  contents: read
jobs:
  probe:
    name: vm2-release-secret-probe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlled provenance proof
        env:
          VM2_SENTINEL: ${{ secrets.VM2_RELEASE_SECRET_SENTINEL }}
        run: |
          if [ -n "$VM2_SENTINEL" ]; then echo 'VM2_RELEASE_SECRET_PRESENT=true'; else echo 'VM2_RELEASE_SECRET_PRESENT=false'; exit 20; fi
          if grep -q 'VM2_SECONDARY_ATTACKER_CONTENT' vm2-release-prefix-attacker.txt; then echo 'VM2_ATTACKER_CONTENT_PRESENT=true'; else echo 'VM2_ATTACKER_CONTENT_PRESENT=false'; exit 21; fi
          echo "VM2_RELEASE_REF=$GITHUB_REF"
