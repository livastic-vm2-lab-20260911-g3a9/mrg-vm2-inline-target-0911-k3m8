name: VM2 Base Delta Guard
on:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    name: vm2-base-delta-guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate speculative tree against direct base delta
        shell: bash
        run: |
          echo "VM2_HEAD_REF=${GITHUB_HEAD_REF}"
          echo "VM2_BASE_REF=${GITHUB_BASE_REF}"
          if [[ "$GITHUB_HEAD_REF" == mergify/merge-queue/* ]]; then
            echo VM2_SPECULATIVE_DELAY_BEGIN
            sleep 90
            if [[ -e vm2-unvalidated-base.txt ]]; then
              echo VM2_UNVALIDATED_BASE_PRESENT_FAIL
              exit 19
            fi
            echo VM2_OLD_BASE_TREE_PASS
          else
            echo VM2_SOURCE_FAST_PASS
          fi
