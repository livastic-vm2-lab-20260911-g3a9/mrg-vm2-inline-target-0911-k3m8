name: VM2 Auto-Retry Victim
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  victim-retry-job:
    name: victim-retry-job
    runs-on: ubuntu-latest
    steps:
      - name: Trusted run marker
        env:
          VM2_SENTINEL: ${{ secrets.VM2_AUTORETRY_SECRET_SENTINEL }}
        run: |
          if [ -n "$VM2_SENTINEL" ]; then echo 'VM2_AUTORETRY_SECRET_PRESENT=true'; else echo 'VM2_AUTORETRY_SECRET_PRESENT=false'; exit 31; fi
          echo "VM2_AUTORETRY_RUN_ATTEMPT=$GITHUB_RUN_ATTEMPT"
          echo "VM2_AUTORETRY_RUN_ID=$GITHUB_RUN_ID"
